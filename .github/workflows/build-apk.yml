name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Firebase config (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Firebase activado"
          else
            echo "Sin GOOGLE_SERVICES_JSON: la app se compila sin cuentas en la nube"
          fi

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk EpubFold-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EpubFold-apk
          path: EpubFold-*.apk

      # Repo público con sólo el último APK: la app lo consulta para avisar de actualizaciones.
      # Se publica un único commit huérfano (force push) para que el repo no crezca.
      - name: Publish update channel (optional)
        # Si el envío se atasca o falla, el release de GitHub se publica igualmente
        timeout-minutes: 5
        continue-on-error: true
        env:
          RELEASES_DEPLOY_KEY: ${{ secrets.RELEASES_DEPLOY_KEY }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$RELEASES_DEPLOY_KEY" ]; then
            echo "Sin RELEASES_DEPLOY_KEY: no se publica el canal de actualizaciones"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$RELEASES_DEPLOY_KEY" > ~/.ssh/releases_key
          chmod 600 ~/.ssh/releases_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/releases_key -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=15"
          N=${{ github.run_number }}
          mkdir channel && cd channel
          git init -q -b main
          cp ../EpubFold-$N.apk EpubFold.apk
          NOTES=$(printf '%s' "${COMMIT_MSG:-Build $N}" | head -c 600)
          jq -n --argjson code "$N" --arg name "1.0.$N" --arg notes "$NOTES" --arg sha "${{ github.sha }}" \
            --arg apk "https://raw.githubusercontent.com/emmanuelquintana/epub-fold-releases/main/EpubFold.apk" \
            '{versionCode: $code, versionName: $name, notes: $notes, sha: $sha, apk: $apk}' > latest.json
          printf '# EpubFold\n\nÚltimo APK: [EpubFold.apk](EpubFold.apk) (build %s).\n' "$N" > README.md
          git add -A
          git -c user.name="EpubFold CI" -c user.email="ci@epubfold.invalid" commit -q -m "Build $N"
          git push -q --force git@github.com:emmanuelquintana/epub-fold-releases.git main
          echo "Canal de actualizaciones publicado: build $N"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: EpubFold build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_name != 'main' }}
          files: EpubFold-*.apk
          body: |
            APK de EpubFold (rama `${{ github.ref_name }}`, commit ${{ github.sha }}).
            Descárgalo en el teléfono y ábrelo para instalar (permite "instalar apps desconocidas").
